# The proxy on its own, serving a compiled snapshot file without a control
# plane. Compile one with proxelo (see README), then:
#   docker compose up --build
# To run the proxy under the control plane, use proxelo's compose.yaml.
name: proxelo-proxy

services:
  proxy:
    build:
      context: .
      args:
        FEATURES: ${PROXELO_FEATURES:-}
    image: proxelo-proxy:local
    command:
      - serve
      - /etc/proxelo/snapshot.bin
      - --metrics
      - 0.0.0.0:9145
    ports:
      # The snapshot's listener addresses; examples/basic.json uses 8080.
      - "${PROXELO_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${PROXELO_METRICS_PORT:-9145}:9145"
    volumes:
      - ${PROXELO_SNAPSHOT:-./snapshot.bin}:/etc/proxelo/snapshot.bin:ro
    restart: unless-stopped
