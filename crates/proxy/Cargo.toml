[package]
name = "proxelo-proxy"
description = "Proxelo data plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Allocator candidates under evaluation. Enable at most one;
# neither means the system allocator.
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
proxelo-api.workspace = true
proxelo-server.workspace = true
proxelo-snapshot.workspace = true
proxelo-sync.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tokio.workspace = true

[lints]
workspace = true
