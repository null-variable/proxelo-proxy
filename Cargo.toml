[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/null-variable/proxelo-proxy"
publish = false

[workspace.dependencies]
proxelo-api = { git = "https://github.com/null-variable/proxelo-api", tag = "v0.1.0" }
prost = "0.14"
arc-swap = "1.9"
foldhash = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
memchr = "2.8"
pcre2 = "0.2"
mimalloc = "0.1"
socket2 = { version = "0.6", features = ["all"] }
stats_alloc = "0.1"
tikv-jemallocator = "0.7"
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
proxelo-http1 = { path = "crates/http1" }
proxelo-server = { path = "crates/server" }
proxelo-snapshot = { path = "crates/snapshot" }
proxelo-sync = { path = "crates/sync" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
