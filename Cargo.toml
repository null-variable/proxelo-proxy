[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/null-variable/proxelo-proxy"
publish = false

[workspace.dependencies]
proxelo-api = { git = "https://github.com/null-variable/proxelo-api", tag = "v0.0.1" }
prost = "0.14"
proxelo-snapshot = { path = "crates/snapshot" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
